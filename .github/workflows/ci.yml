# agy-cloud CI (T0-owned).
#
# Required check name for branch protection: `lint-unit` (the job id/name
# below) — confirmed against V1-TASKS "必需检查名统一为实际job lint-unit".
#
# Credential policy:
# - Public/fork PRs run ONLY lint-unit via the `pull_request` event: no cloud
#   credentials, no id-token write, read-only token.
# - Cloud verification runs ONLY for trusted same-repo PRs with the explicit
#   label `run-cloud-verify` (event types: [labeled]) or via an explicit
#   branch-scoped workflow_dispatch selection. The `pull_request_target`
#   event is used for the label gate but NEVER checks out PR head code —
#   only the PR's base sha — so untrusted PR code is never executed with
#   credentials.
# - Deferred targets (make itest / make e2e-local) are intentionally NOT run
#   here: they are unimplemented in T0 and exit nonzero by design. They are
#   wired into CI by T10/T12 when implemented.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      checks:
        description: "Which checks to run (explicit selection; no PR fields needed)"
        required: true
        type: choice
        default: "lint-unit"
        options:
          - lint-unit
          - verify-creds
          - all

# Least default permissions; jobs tighten or narrow explicitly.
permissions:
  contents: read

jobs:
  lint-unit:
    name: lint-unit
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.checks == 'lint-unit' || inputs.checks == 'all'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report cloud-verification policy (skip reporting)
        run: |
          echo "## CI summary" >> "$GITHUB_STEP_SUMMARY"
          echo "lint-unit: lint + unit + machine contract validation (no cloud credentials)." >> "$GITHUB_STEP_SUMMARY"
          echo "cloud-verify: skipped for this event — requires label 'run-cloud-verify' on a same-repo PR, or workflow_dispatch selection 'verify-creds'/'all'." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint (byte-compile + ruff; failures fail the job)
        run: make lint
      - name: Unit tests
        run: make test
      - name: Machine contract validation
        run: make contract-check

  cloud-verify:
    name: cloud-verify
    # Trusted gates only: same-repo PR explicitly labeled run-cloud-verify,
    # or an explicit workflow_dispatch selection. Never for forks.
    if: >-
      (github.event_name == 'pull_request_target' &&
        github.event.label.name == 'run-cloud-verify' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.checks == 'verify-creds' || inputs.checks == 'all'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for workload identity federation; nothing else
    steps:
      - name: Guard (re-check trust conditions before touching credentials)
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            label="${{ github.event.label.name }}"
            head_repo="${{ github.event.pull_request.head.repo.full_name }}"
            this_repo="${{ github.repository }}"
            if [ "$label" != "run-cloud-verify" ]; then
              echo "::error::cloud-verify requires label run-cloud-verify (got: $label)"; exit 1
            fi
            if [ "$head_repo" != "$this_repo" ]; then
              echo "::error::cloud-verify is restricted to same-repo PRs (got: $head_repo)"; exit 1
            fi
          fi
          echo "cloud-verify: read-only credential verification for agy-cloud-ci (no secrets printed)."
      # NEVER check out PR head here (untrusted code). Base sha for labeled
      # PRs; dispatched ref for workflow_dispatch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/931055573859/locations/global/workloadIdentityPools/github/providers/github
          service_account: agy-ci@agy-cloud-ci.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: agy-cloud-ci
      - name: Read-only credential verification (redacted)
        run: make verify-creds
        env:
          GCP_PROJECT: agy-cloud-ci
          AGY_GCS_BUCKET: agy-cloud-agy-cloud-ci
